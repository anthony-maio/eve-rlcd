[project]
name = "eve-rlcd"
version = "0.1.0"
description = "Toy recreation of RLCD (RL for Calibrated Decisions): a small decision model trained from bandit feedback"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.7",
    "transformers>=4.51,<5",
    "datasets>=3.2",
    "safetensors>=0.5",
    "huggingface-hub>=0.30",
    "numpy>=2",
    "matplotlib>=3.9",
    "tqdm>=4.66",
    "peft>=0.21.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: needs internet access",
    "gpu: needs a CUDA device",
]
addopts = "-m 'not network and not gpu'"
filterwarnings = ["ignore:Some non-default generation parameters:UserWarning"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rlcd"]
